<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stránka nenalezena · PROTO ROBOT</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FF5A00">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23FF5A00'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='30' fill='%23000'%3EPR%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<!-- GitHub Pages serves this file for every missing path, so all links and assets are absolute -->
<style>
:root{
  --orange:#FF5A00; --black:#000; --white:#fff; --grey:#F0F0F0; --grey-text:#5c5c5c;
  --font:"Archivo","Archivo Fallback","Helvetica Neue",Arial,sans-serif;
  --gt:10px; --pill-h:52px; --nav-fs:18px; --s2:20px; --s3:40px;
}
@media (max-width:640px){:root{--pill-h:44px;--nav-fs:15px;--gt:16px;--s3:28px}}
@font-face{font-family:"Archivo Fallback";src:local("Arial");size-adjust:101%;ascent-override:88%;descent-override:22%;line-gap-override:0%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--grey);color:var(--black);font-size:18px;line-height:1.35;-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:var(--s3) var(--gt)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--black);outline-offset:3px;border-radius:999px}
.mark{display:block;font-weight:900;font-style:italic;font-stretch:125%;font-size:clamp(56px,12vw,140px);line-height:.8;letter-spacing:-.05em;text-transform:uppercase}
.mark span{display:block}
.code{display:inline-flex;align-items:center;height:44px;padding:0 16px;margin-top:var(--s3);background:var(--black);color:var(--white);font-size:20px;letter-spacing:-.01em}
h1{margin-top:var(--s3);font-weight:300;font-size:clamp(36px,4.8vw,68px);line-height:.95;letter-spacing:-.04em;text-wrap:balance}
h1 span{display:block;color:var(--grey-text)}
.home{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:var(--s3)}
.pill{display:inline-flex;align-items:center;justify-content:center;height:var(--pill-h);padding:0 25px;border-radius:999px;background:var(--black);color:var(--white);
  font-size:var(--nav-fs);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;transition:background .18s,color .18s}
.pill:hover{background:var(--orange);color:var(--black)}
@media (prefers-reduced-motion:reduce){.pill{transition:none}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span>Proto</span><span>Robot</span></div>
  <span class="code">404</span>
  <h1>Stránka nenalezena <span lang="en">Page not found</span></h1>
  <p class="home"><a class="pill" href="/">Domů</a><a class="pill" href="/en/" hreflang="en" lang="en">Home</a></p>
</main>
</body>
</html>
